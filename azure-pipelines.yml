trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: windows-latest

steps:
  - checkout: self

  - task: GoTool@0
    displayName: Use Go 1.22
    inputs:
      version: 1.22.x

  - script: go test ./...
    displayName: Run Go tests

  - script: go vet ./...
    displayName: Run go vet

  - powershell: |
      $ErrorActionPreference = 'Stop'
      $env:GOOS = 'windows'
      $env:GOARCH = 'amd64'
      $env:CGO_ENABLED = '0'
      go build -o "$(Build.ArtifactStagingDirectory)\RESPProxy.exe" .
    displayName: Build Windows executable

  - task: PublishPipelineArtifact@1
    displayName: Publish RESPProxy.exe
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)
      artifact: RESPProxy-windows-x64
